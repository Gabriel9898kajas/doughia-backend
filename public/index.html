<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoughIA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      padding: 18px;
      background: #111;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 15px;
      box-sizing: border-box;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #d9d9d9;
    }

    .ai {
      margin-right: auto;
      background: white;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>DoughIA</header>

  <div id="chat"></div>

  <div class="input-area">
    <input id="message" type="text" placeholder="Digite sua mensagem...">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const API_URL = "https://doughia-backend.onrender.com/chat";

    async function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      addMessage("Pensando...", "ai");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        const thinkingMessages = document.querySelectorAll(".ai");
        const lastMessage = thinkingMessages[thinkingMessages.length - 1];

        if (data.response) {
          lastMessage.textContent = data.response;
        } else {
          lastMessage.textContent = "Erro ao receber resposta.";
        }

      } catch (error) {
        const thinkingMessages = document.querySelectorAll(".ai");
        const lastMessage = thinkingMessages[thinkingMessages.length - 1];

        lastMessage.textContent = "Não foi possível conectar ao servidor.";
      }
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
  </html>
